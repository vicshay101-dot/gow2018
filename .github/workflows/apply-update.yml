name: Apply update zip

on:
  push:
    branches: [android]
    paths:
      - gow2018-update.zip

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android

      - name: Unzip and apply source updates
        run: |
          set -euo pipefail
          test -f gow2018-update.zip
          unzip -o gow2018-update.zip
          if [ -f apply-update.py ]; then
            python3 apply-update.py
            rm -f apply-update.py
          fi
          rm -f gow2018-update.zip
          git config user.name "update-bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply Android diagnostics update"
          git push origin HEAD:android

      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bionic-apk.yml --ref android
